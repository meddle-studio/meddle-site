<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Article",
      "@id": "{{ page.url | absolute_url }}#project",
      "headline": {{ page.title | jsonify }},
      "name": {{ page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "abstract": {{ page.result_summary | default: page.description | jsonify }},
      "url": "{{ page.url | absolute_url }}",
      "image": {
        "@type": "ImageObject",
        "url": "{{ page.image | default: page.hero_video.poster | absolute_url }}"
      },
      "datePublished": "{{ page.date | date_to_xmlschema }}",
      "dateModified": "{{ site.time | date_to_xmlschema }}",
      "creator": { "@id": "https://meddle.studio/#organization" },
      "author": {
        "@type": "Person",
        "@id": "https://matthewbacon.com/",
        "name": "Matt Bacon"
      },
      "publisher": {
        "@type": "Organization",
        "@id": "https://meddle.studio/#organization"
      },
      "about": {{ page.about | default: page.services | jsonify }},
      "keywords": {{ page.keywords | default: page.services | jsonify }},
      "genre": {{ page.industry | jsonify }},
      "mentions": { "@id": "{{ page.url | absolute_url }}#client" },
      {%- if page.quotes or page.quote -%}
      "hasPart": [
        {%- for q in page.quotes -%}
        {%- assign who = q.attribution | split: "<br>" -%}
        {
          "@type": "Review",
          "reviewBody": {{ q.text | strip_html | replace: "&nbsp;", " " | jsonify }},
          "author": { "@type": "Person", "name": {{ who[0] | jsonify }}, "jobTitle": {{ who[1] | jsonify }} },
          "itemReviewed": { "@id": "https://meddle.studio/#organization" }
        }{% unless forloop.last %},{% endunless %}
        {%- endfor -%}
        {%- if page.quote -%}
        {%- assign who = page.quote.attribution | split: "<br>" -%}
        {
          "@type": "Review",
          "reviewBody": {{ page.quote.text | strip_html | replace: "&nbsp;", " " | jsonify }},
          "author": { "@type": "Person", "name": {{ who[0] | jsonify }}, "jobTitle": {{ who[1] | jsonify }} },
          "itemReviewed": { "@id": "https://meddle.studio/#organization" }
        }
        {%- endif -%}
      ],
      {%- endif -%}
      "inLanguage": "en-US",
      "isPartOf": {
        "@type": "CreativeWorkSeries",
        "name": "Meddle Case Studies",
        "url": "{{ site.url }}/#work"
      }
    },
    {
      "@type": "Organization",
      "@id": "{{ page.url | absolute_url }}#client",
      "name": {{ page.client | jsonify }},
      "description": {{ page.client_description | default: "Client featured in this Meddle case study" | jsonify }}
      {%- if page.client_url -%},
      "url": {{ page.client_url | jsonify }}
      {%- endif -%}
      {%- if page.client_founder -%},
      "founder": { "@type": "Person", "name": {{ page.client_founder.name | jsonify }}{% if page.client_founder.job_title %}, "jobTitle": {{ page.client_founder.job_title | jsonify }}{% endif %} }
      {%- endif -%}
      {%- if page.industry -%},
      "knowsAbout": {{ page.about | jsonify }},
      "additionalType": {{ page.industry | jsonify }}
      {%- endif -%}
    },
    {
      "@type": "Person",
      "@id": "https://matthewbacon.com/",
      "name": "Matt Bacon",
      "jobTitle": "Founder & Creative Director",
      "url": "https://meddle.studio/",
      "worksFor": { "@id": "https://meddle.studio/#organization" }
    },
    {
      "@type": "Organization",
      "@id": "https://meddle.studio/#organization",
      "name": "Meddle",
      "url": "https://meddle.studio/"
    }
  ]
}
</script>
